[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-air-driver"
version = "0.1.0"
description = "Evidence-aware offline-first Unitree actuator driver"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5,<4"]

[project.scripts]
go2motor = "go2driver.cli:main"

[tool.setuptools]
packages = ["go2driver"]
